body{display:block}.stage{width:100%;height:100%;padding:68px 24px;background:radial-gradient(ellipse at center,#2d2f34 0%,#242528 51%,#202124 90%)}
.preview-group{position:relative;display:block}.preview-label{position:absolute;bottom:calc(100% + 13px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);height:36px;pointer-events:none}.preview-label strong{font-size:11px;font-weight:500;color:#b8bdc7}.preview-label span{font-size:10px;color:#7f8590}.footer{display:none}

<body>
<div hidden><strong id="device-name"></strong><span id="dimensions"></span></div>
<aside class="tool-dock" aria-label="Preview tools">
 <button id="tools-toggle" class="tools-toggle" aria-expanded="false" aria-controls="floating-tools" aria-label="Show preview controls" title="Preview controls"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
 <div id="floating-tools" class="floating-tools"><nav class="navigation" aria-label="Preview navigation"><button class="icon-button" data-action="back" aria-label="Back" title="Back"><svg viewBox="0 0 24 24"><path d="m13 6-6 6 6 6M7 12h12"/></svg></button><button class="icon-button" data-action="forward" aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24"><path d="m11 6 6 6-6 6M5 12h12"/></svg></button><button class="icon-button" data-action="reload" aria-label="Reload preview" title="Reload preview"><svg viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></svg></button><div class="url" id="url"></div><div id="status" class="status" role="status" data-state="connecting"><span class="dot"></span><span id="status-text">Connecting</span></div></nav><div class="controls"><button id="link" class="pill" aria-pressed="false" title="Synchronize clicks, typing, navigation, and scrolling between previews" aria-label="Link previews"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4m-6 7-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 2 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0)"/></svg><span class="button-label">Link previews</span></button><button id="frame" class="pill" aria-pressed="true" title="Show device frame" aria-label="Show device frame"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4m-3 14h2"/></svg><span class="button-label">Frame</span></button></div></div>
</aside>
<main class="stage" id="stage"><div class="preview-group"><div class="preview-label"><strong id="preview-name"></strong><span id="preview-size"></span></div><div class="fit-box" id="fit-box"><div class="device" id="device"><div class="hardware-top" aria-hidden="true"><span class="clock">9:41</span><span class="camera"></span><span class="system-icons"><svg viewBox="0 0 20 20"><path d="M2 15v-2m4 2v-5m4 5V7m4 8V4"/></svg><svg viewBox="0 0 20 20"><path d="M2 7a12 12 0 0 1 16 0M5 10a8 8 0 0 1 10 0m-7 3a3 3 0 0 1 4 0m-2 3h.01"/></svg><svg viewBox="0 0 22 20"><rect x="1" y="5" width="16" height="10" rx="2"/><path d="M20 8v4M4 8h10v4H4z"/></svg></span></div><div class="screen" id="screen" tabindex="0" role="application" aria-label="Interactive device preview. Click to focus; keyboard and pointer input control the website."><img id="display" alt="Live website preview" draggable="false"><div class="loading" id="loading">Connecting to your preview…</div></div><div class="hardware-bottom" aria-hidden="true"></div></div></div></div><div class="toast" id="toast" role="alert" hidden></div></main>
<footer class="footer"><span id="footer-device"></span><span class="separator">·</span><span id="scale"></span><span class="separator">·</span><span>ScreenHop 1.0.0</span></footer>
<script>
'use strict';
const config = __SCREENHOP_CONFIG__;
const $ = id => document.getElementById(id);
const screen = $('screen'), display = $('display'), device = $('device');
const width = Number(config.width), height = Number(config.height);
device.style.setProperty('--w', width); device.style.setProperty('--h', height);
const name = String(config.name || 'Custom device');
const group = String(config.group || '').toLowerCase();
const style = /tablet|ipad/i.test(group + ' ' + name) ? 'tablet' : /iphone|apple/i.test(name + ' ' + group) ? 'iphone' : /android|phone/i.test(group) || config.mobile ? 'android' : 'desktop';
device.classList.add(style);
document.title = `ScreenHop • ${name} • ${width}×${height}`;
$('device-name').textContent = name;
$('dimensions').textContent = `${width} × ${height} CSS px · ${config.dpr || 1}× pixel density`;
$('footer-device').textContent = name;
$('preview-name').textContent = name;
$('preview-size').textContent = `${width} × ${height} CSS px`;
let linked = Boolean(config.linked), showFrame = true, connected = false, toastTimer;
try { showFrame = localStorage.getItem('screenhop.frame') !== 'off'; } catch {}
function fit() {
 const stage = $('stage'), styles = getComputedStyle(stage);
 const availableWidth = stage.clientWidth - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight) - 8;
 const availableHeight = stage.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom) - 8;
 const extra = showFrame && style === 'desktop' ? 32 : 0;
 const scale = Math.max(.01, Math.min(1, availableWidth / device.offsetWidth, availableHeight / (device.offsetHeight + extra)));
 device.style.transform = `scale(${scale})`;
 $('fit-box').style.width = `${device.offsetWidth * scale}px`;
 $('fit-box').style.height = `${(device.offsetHeight + extra) * scale}px`;
 $('scale').textContent = `${Math.round(scale * 100)}% display scale`;
}
function updateFrame() { device.classList.toggle('bare', !showFrame); $('frame').setAttribute('aria-pressed', String(showFrame)); fit(); }
function updateState(state) {
 if (state.reason) { $('url').title = state.reason; $('status-text').textContent = 'Linking paused'; toast(state.reason); }
 if (typeof state.url === 'string') { $('url').textContent = state.url; $('url').title = state.url; }
 if (typeof state.linked === 'boolean') linked = state.linked;
 $('link').setAttribute('aria-pressed', String(linked));
}
function status(state, message) { connected = state === 'live'; $('status').dataset.state = state; $('status-text').textContent = message; }
function toast(message) { $('toast').textContent = message; $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true; }, 4500); }
async function post(route, data) {
 const response = await fetch(config.base + route, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 if (!response.ok) throw new Error(`Preview request failed (${response.status})`);
}
// Serialize input so fast clicks, typing, and modifier releases retain their order.
let inputQueue = Promise.resolve();
function input(data) { if (!connected) return; inputQueue = inputQueue.then(() => post('/input', data)).catch(error => toast(error.message)); }
async function action(data) { try { await post('/action', data); } catch(error) { toast(error.message); } }
document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => action({action:button.dataset.action})));
$('tools-toggle').addEventListener('click', () => { const opened = document.querySelector('.tool-dock').classList.toggle('open'); $('tools-toggle').setAttribute('aria-expanded',String(opened)); });
document.querySelector('.tool-dock').addEventListener('keydown', event => { if (event.key === 'Escape') { document.querySelector('.tool-dock').classList.remove('open'); $('tools-toggle').setAttribute('aria-expanded','false'); screen.focus({preventScroll:true}); } });
$('link').addEventListener('click', () => action({action:'link',enabled:!linked}));
$('frame').addEventListener('click', () => { showFrame = !showFrame; try { localStorage.setItem('screenhop.frame',showFrame ? 'on':'off'); } catch {} updateFrame(); });
function point(event) { const rect = screen.getBoundingClientRect(); return {x:Math.max(0,Math.min(width - .01,(event.clientX - rect.left) * width / rect.width)),y:Math.max(0,Math.min(height - .01,(event.clientY - rect.top) * height / rect.height))}; }
function modifiers(event) { return (event.altKey ? 1:0) | (event.ctrlKey ? 2:0) | (event.metaKey ? 4:0) | (event.shiftKey ? 8:0); }
const buttonName = index => ['left','middle','right'][index] || 'none';
let clickCount = 1, previousClick = {time:0,x:0,y:0,button:-1}, capturedPointer = null, lastPoint = {x:0,y:0}, heldButton = 'left';
screen.addEventListener('pointerdown', event => {
 if (capturedPointer !== null) return;
 event.preventDefault(); screen.focus({preventScroll:true});
 const p = point(event), now = performance.now();
 clickCount = now - previousClick.time < 450 && Math.hypot(p.x - previousClick.x,p.y - previousClick.y) < 5 && event.button === previousClick.button ? Math.min(clickCount + 1,3) : 1;
 previousClick = {...p,time:now,button:event.button}; capturedPointer = event.pointerId; lastPoint = p; heldButton = buttonName(event.button);
 screen.setPointerCapture(event.pointerId);
 input({kind:'mouse',type:'mousePressed',...p,button:heldButton,buttons:event.buttons,clickCount,modifiers:modifiers(event)});
});
let movePending = null, moveScheduled = false;
function flushMove() { if (movePending) { input(movePending); movePending = null; } }
screen.addEventListener('pointermove', event => {
 lastPoint = point(event);
 movePending = {kind:'mouse',type:'mouseMoved',...lastPoint,button:event.buttons ? heldButton:'none',buttons:event.buttons,clickCount:0,modifiers:modifiers(event)};
 if (!moveScheduled) { moveScheduled = true; requestAnimationFrame(() => { moveScheduled = false; flushMove(); }); }
});
screen.addEventListener('pointerup', event => {
 if (capturedPointer !== event.pointerId) return;
 flushMove(); input({kind:'mouse',type:'mouseReleased',...point(event),button:heldButton,buttons:event.buttons,clickCount,modifiers:modifiers(event)});
 capturedPointer = null; screen.releasePointerCapture(event.pointerId);
});
function releasePointer() { if (capturedPointer !== null) { input({kind:'mouse',type:'mouseReleased',...lastPoint,button:heldButton,buttons:0,clickCount:1,modifiers:0}); capturedPointer = null; } }
screen.addEventListener('pointercancel', releasePointer);
screen.addEventListener('lostpointercapture', releasePointer);
screen.addEventListener('contextmenu', event => event.preventDefault());
screen.addEventListener('wheel', event => { event.preventDefault(); flushMove(); const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? height : 1; input({kind:'wheel',...point(event),deltaX:event.deltaX * unit,deltaY:event.deltaY * unit,modifiers:modifiers(event)}); },{passive:false});
const heldKeys = new Map();
screen.addEventListener('keydown', event => {
 // Allow the browser's paste event; the clipboard text is forwarded below.
 if ((event.ctrlKey || event.metaKey) && event.code === 'KeyV') return;
 if (event.isComposing || event.key === 'Process') return;
 event.preventDefault();
 const data = {kind:'key',type:'keyDown',key:event.key,code:event.code,keyCode:event.keyCode,modifiers:modifiers(event)};
 if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) data.text = event.key;
 if (event.key === 'Enter') data.text = '\r';
 heldKeys.set(event.code, data); input(data);
});
screen.addEventListener('keyup', event => {
 if ((event.ctrlKey || event.metaKey) && event.code === 'KeyV') return;
 if (event.isComposing || event.key === 'Process') return;
 event.preventDefault(); heldKeys.delete(event.code);
 input({kind:'key',type:'keyUp',key:event.key,code:event.code,keyCode:event.keyCode,modifiers:modifiers(event)});
});
screen.addEventListener('paste', event => { event.preventDefault(); const text = event.clipboardData?.getData('text/plain'); if (text) input({kind:'text',text}); });
screen.addEventListener('compositionend', event => { if (event.data) input({kind:'text',text:event.data}); });
function releaseKeys() { for (const data of heldKeys.values()) { const up = {...data,type:'keyUp',modifiers:0}; delete up.text; input(up); } heldKeys.clear(); }
screen.addEventListener('blur', releaseKeys);
window.addEventListener('blur', () => { releaseKeys(); releasePointer(); });
const events = new EventSource(config.base + '/events');
events.addEventListener('open', () => status('live','Live'));
events.addEventListener('frame', event => { try { const frame = JSON.parse(event.data); if (typeof frame.data !== 'string') return; display.src = 'data:image/jpeg;base64,' + frame.data; screen.classList.add('has-frame'); status('live','Live'); } catch { toast('Unable to display a preview frame.'); } });
events.addEventListener('state', event => { try { updateState(JSON.parse(event.data)); } catch {} });
events.addEventListener('error', event => { if (event.data) { try { const error = JSON.parse(event.data); toast(error.message || 'Preview unavailable.'); status('error','Unavailable'); } catch {} } else { status('connecting','Reconnecting'); } });
window.addEventListener('pagehide', () => events.close());
new ResizeObserver(fit).observe($('stage'));
updateState(config); updateFrame();
</script>
</body>
</html>
